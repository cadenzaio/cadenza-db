name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release and Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write # to push tags and release notes
      issues: write # if using semantic-release to comment on issues/PRs
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Use npm 11.11.0
        run: npm install -g npm@11.11.0

      - name: Print tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build package
        run: yarn build

      - name: Configure npm authentication
        run: |
          NPMRC_PATH="$HOME/.npmrc"
          cat > "$NPMRC_PATH" <<'EOF'
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          registry=https://registry.npmjs.org/
          EOF
          echo "NPM_CONFIG_USERCONFIG=$NPMRC_PATH" >> "$GITHUB_ENV"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm authentication
        run: npm whoami --userconfig "$NPM_CONFIG_USERCONFIG" --registry https://registry.npmjs.org/
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release with semantic-release
        run: npx semantic-release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package tarball
        run: |
          TARBALL="$(find "$PWD/release-artifacts" -maxdepth 1 -name '*.tgz' -print -quit)"
          if [ -n "$TARBALL" ]; then
            npm publish "$TARBALL" --userconfig "$NPM_CONFIG_USERCONFIG" --registry https://registry.npmjs.org/ --access public
          else
            echo "No release tarball produced; skipping npm publish."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
